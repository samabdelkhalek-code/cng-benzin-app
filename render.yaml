services:
  # Backend: API Proxy für CNG-Daten
  - type: web
    name: cng-proxy
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: NODE_ENV
        value: production
      # Free key from https://onboarding.tankerkoenig.de — enables real Benzin
      # prices. sync: false keeps the value in the dashboard, never in the repo.
      # Without it the proxy uses the public demo key, which returns genuine
      # stations but a placeholder price that is withheld from the UI.
      - key: TANKERKOENIG_API_KEY
        sync: false

  # Frontend: Expo Web Static Site (dist/ is pre-built and committed)
  - type: web
    name: cng-app-web
    runtime: static
    staticPublishPath: ./dist
    headers:
      # Expo stamps a content hash into every asset filename, so these can be
      # cached forever — Render otherwise sends max-age=0 and the browser
      # re-fetches the ~435 kB bundle on every visit.
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The entry document must stay fresh, or a new build is never picked up.
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: EXPO_PUBLIC_PROXY_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
